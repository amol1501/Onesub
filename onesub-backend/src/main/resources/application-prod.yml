spring:
  datasource:
    url: ${ONESUB_DB_URL}
    username: ${ONESUB_DB_USERNAME}
    password: ${ONESUB_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${ONESUB_FLYWAY_ENABLED:true}

server:
  port: ${ONESUB_SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

onesub:
  email:
    provider: ${ONESUB_EMAIL_PROVIDER:log}
