spring:
  datasource:
    url: ${ONESUB_DB_URL:jdbc:postgresql://localhost:5432/onesub}
    username: ${ONESUB_DB_USERNAME:onesub}
    password: ${ONESUB_DB_PASSWORD:onesub_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${ONESUB_SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: false
        same-site: lax

onesub:
  email:
    provider: log
