services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - onesub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: onesub-backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ONESUB_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ONESUB_DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      ONESUB_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ONESUB_SERVER_PORT: "8080"
      ONESUB_EMAIL_PROVIDER: log
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx640m -XX:MaxMetaspaceSize=192m
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./onesub-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ONESUB_FQDN: ${ONESUB_FQDN:?Set ONESUB_FQDN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./onesub-infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  onesub-postgres-data:
  caddy-data:
  caddy-config:
